<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hope – Support a Medical Treatment</title>
  <meta name="description" content="Donate securely with PayPal to support a medical treatment through Hope." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-dot"></span>Hope</div>
    <h1>Support a Medical Treatment</h1>
    <p class="sub">Every contribution helps a patient get the care they need. Sandbox mode – no real money is moved.</p>

    <label for="amount" class="label">Donation amount (USD)</label>
    <div class="amount-wrap">
      <span class="currency">$</span>
      <input id="amount" type="number" inputmode="decimal" min="1" step="0.01" value="5" />
    </div>

    <div class="presets" role="group" aria-label="Preset amounts">
      <button type="button" class="preset" data-amount="5">$5</button>
      <button type="button" class="preset" data-amount="10">$10</button>
      <button type="button" class="preset" data-amount="25">$25</button>
      <button type="button" class="preset" data-amount="50">$50</button>
    </div>
    <p id="amount-error" class="field-error" role="alert" hidden></p>

    <div id="paypal-button-container"></div>

    <section id="status" class="status" aria-live="polite" hidden>
      <div id="status-spinner" class="spinner" hidden></div>
      <div id="status-title" class="status-title"></div>
      <div id="status-body" class="status-body"></div>
    </section>
  </main>

  <script src="/static/js/checkout.js"></script>
</body>
</html>
